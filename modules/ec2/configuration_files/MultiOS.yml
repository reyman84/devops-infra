#!/home/ansible/ansible/DEV/bin/ansible-playbook

# -------------------------------------------------------------------------
# Playbook  : Multi-Environment Web Server Configuration
# Purpose   : Perform global user/group management and configure
#             environment-specific web servers using Ansible.
#
# Environments:
#   - dev   : Ubuntu (Debian-based) with Nginx and Apache2
#   - stage : RHEL-based with Apache (httpd)
#
# Inventory : Dynamic AWS EC2 inventory (amazon.aws.aws_ec2 plugin)
# -------------------------------------------------------------------------

- name: "Global Tasks"
  hosts: all
  become: yes
  gather_facts: false
  tags: global

  vars:
    USER_GROUP_MAP:
      Ramandeep: Amritsar
      Ganeev: Punjab
      Manpreet: India

  tasks:
    - name: Create groups first
      ansible.builtin.group:
        name: "{{ item.value }}"
        state: present
      loop: "{{ USER_GROUP_MAP | dict2items }}"

    - name: Create users and map with Groups
      ansible.builtin.user:
        name: "{{ item.key }}"
        group: "{{ item.value }}"
        state: present
        create_home: yes
      loop: "{{ USER_GROUP_MAP | dict2items }}"

